{% extends 'base.html' %}
{% block content %}
<h4>Respond — {{ ticket.ticket_number }}</h4>
<div class="alert alert-warning">{{ ticket.more_info_request }}</div>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Submit Response</button>
      <a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
